description = "Audit a codebase for evidence-backed simplification"
prompt = "Audit the requested repository or subsystem for unnecessary complexity and missed reuse. Honor the boundary and report material coverage limits. Read the affected implementation and callers before judging necessity. Compare any proposed existing helper, standard-library or platform replacement against the same semantics, errors, ownership, execution context, compatibility and performance constraints. A single caller or implementation is not proof of waste; retain useful lifetime rules, invariants, test seams and supported public-interface evolution. Judge total caller and maintainer burden, not line count. For each finding give location, evidence, concrete maintenance cost and the smallest replacement preserving requirements, validation, safety and meaningful tests. Rank by consequence and confidence; mark unverified assumptions. Optional tags: delete, stdlib, native, yagni, shrink. This is read-only complexity review, not overall merge approval or a full correctness/security/performance audit. Note incidental concrete defects separately. Do not require deletion totals. If none are supported, say: No actionable complexity findings."
